<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'Noto Serif SC', 'Ma Shan Zheng', monospace, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90d9"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#238636"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0b0e"/>
      <stop offset="100%" style="stop-color:#12141c"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="680" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="450" y="42" font-size="22" fill="#e6edf3" text-anchor="middle" font-weight="bold">天外来客 · Cloudflare Pages 部署架构</text>
  <text x="450" y="65" font-size="13" fill="#8b949e" text-anchor="middle">tianwailaike.pages.dev | 部署脚本: deploy-cloudflare.sh</text>
  
  <!-- Section 1: 本地开发机 -->
  <rect x="30" y="90" width="340" height="560" rx="16" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <rect x="30" y="90" width="340" height="36" rx="16" fill="#161b22"/>
  <text x="200" y="114" font-size="16" fill="#58a6ff" text-anchor="middle" font-weight="bold">🖥 本地开发机</text>
  
  <!-- deploy script box -->
  <rect x="60" y="145" width="280" height="50" rx="8" fill="#1a1b2e" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="200" y="175" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold">deploy-cloudflare.sh</text>
  <text x="200" y="193" font-size="11" fill="#8b949e" text-anchor="middle">一键部署脚本</text>
  
  <!-- index.html -->
  <rect x="60" y="215" width="130" height="40" rx="6" fill="#1a1b2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="125" y="240" font-size="12" fill="#d2a8ff" text-anchor="middle">index.html</text>
  
  <!-- data dir -->
  <rect x="200" y="215" width="140" height="40" rx="6" fill="#1a1b2e" stroke="#f0883e" stroke-width="1"/>
  <text x="270" y="240" font-size="12" fill="#f0883e" text-anchor="middle">data/*.json</text>
  
  <!-- assets dir -->
  <rect x="60" y="270" width="130" height="40" rx="6" fill="#1a1b2e" stroke="#7ee787" stroke-width="1"/>
  <text x="125" y="295" font-size="12" fill="#7ee787" text-anchor="middle">assets/*.css</text>
  
  <!-- media dir -->
  <rect x="200" y="270" width="140" height="40" rx="6" fill="#1a1b2e" stroke="#79c0ff" stroke-width="1"/>
  <text x="270" y="295" font-size="12" fill="#79c0ff" text-anchor="middle">media/</text>
  
  <!-- wrangler config -->
  <rect x="60" y="330" width="280" height="40" rx="6" fill="#1a1b2e" stroke="#f778ba" stroke-width="1"/>
  <text x="200" y="355" font-size="12" fill="#f778ba" text-anchor="middle">wrangler.toml + .wrangler/ (缓存)</text>
  
  <!-- Git repo -->
  <rect x="60" y="385" width="280" height="40" rx="6" fill="#1a1b2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="200" y="410" font-size="12" fill="#d2a8ff" text-anchor="middle">.git/ → GitHub 仓库</text>
  
  <!-- 部署步骤 -->
  <rect x="60" y="445" width="280" height="180" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="200" y="470" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="bold">部署步骤</text>
  
  <text x="80" y="495" font-size="11" fill="#7ee787">① 生成 BUILD_TIME + HASH</text>
  <text x="80" y="515" font-size="11" fill="#7ee787">② sed 替换页脚时间戳</text>
  <text x="80" y="535" font-size="11" fill="#7ee787">③ sed 替换 CSS/JS 缓存版本</text>
  <text x="80" y="555" font-size="11" fill="#7ee787">④ git add → commit → push</text>
  <text x="80" y="575" font-size="11" fill="#7ee787">⑤ wrangler pages deploy</text>
  
  <!-- Arrow: 本地 -> GitHub -->
  <line x1="370" y1="170" x2="520" y2="170" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="445" y="162" font-size="10" fill="#8b949e" text-anchor="middle">git push</text>
  
  <!-- Section 2: GitHub -->
  <rect x="540" y="130" width="150" height="80" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="615" y="165" font-size="13" fill="#f0883e" text-anchor="middle" font-weight="bold">GitHub</text>
  <text x="615" y="185" font-size="10" fill="#8b949e" text-anchor="middle">备份镜像</text>
  
  <!-- Arrow: 本地 -> Cloudflare -->
  <line x1="370" y1="350" x2="520" y2="350" stroke="#238636" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <text x="445" y="342" font-size="10" fill="#8b949e" text-anchor="middle">wrangler deploy</text>
  
  <!-- Section 3: Cloudflare -->
  <rect x="540" y="290" width="330" height="200" rx="16" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
  <rect x="540" y="290" width="330" height="36" rx="16" fill="#161b22"/>
  <text x="705" y="314" font-size="16" fill="#238636" text-anchor="middle" font-weight="bold">☁ Cloudflare Pages</text>
  
  <!-- Cloudflare build -->
  <rect x="570" y="340" width="270" height="35" rx="6" fill="#1a1b2e" stroke="#4a90d9" stroke-width="1"/>
  <text x="705" y="362" font-size="12" fill="#e6edf3" text-anchor="middle">自动构建 + 静态文件托管</text>
  
  <!-- CDN -->
  <rect x="570" y="390" width="270" height="35" rx="6" fill="#1a1b2e" stroke="#f0883e" stroke-width="1"/>
  <text x="705" y="412" font-size="12" fill="#f0883e" text-anchor="middle">Cloudflare CDN 全球边缘节点</text>
  
  <!-- HTTPS -->
  <rect x="570" y="440" width="270" height="35" rx="6" fill="#1a1b2e" stroke="#7ee787" stroke-width="1"/>
  <text x="705" y="462" font-size="12" fill="#7ee787" text-anchor="middle">自动 HTTPS + 缓存策略</text>
  
  <!-- Cache busting info -->
  <rect x="570" y="490" width="270" height="35" rx="6" fill="#1a1b2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="705" y="512" font-size="11" fill="#d2a8ff" text-anchor="middle">缓存破坏: app.js?v={hash} style.css?v={hash}</text>
  
  <!-- Arrow: Cloudflare -> Users -->
  <line x1="870" y1="390" x2="930" y2="390" stroke="#f0883e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="900" y="382" font-size="10" fill="#8b949e" text-anchor="middle">CDN</text>
  
  <!-- Section 4: Users -->
  <rect x="945" y="350" width="120" height="80" rx="12" fill="#161b22" stroke="#f778ba" stroke-width="1.5"/>
  <text x="1005" y="385" font-size="13" fill="#f778ba" text-anchor="middle" font-weight="bold">🌐 用户</text>
  <text x="1005" y="405" font-size="10" fill="#8b949e" text-anchor="middle">全球访问</text>
  
  <!-- Output URL -->
  <rect x="540" y="520" width="330" height="40" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="1.5"/>
  <text x="705" y="545" font-size="14" fill="#f0883e" text-anchor="middle" font-weight="bold">🌍 https://tianwailaike.pages.dev</text>
  
  <!-- Data sources detail -->
  <rect x="30" y="570" width="340" height="80" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="200" y="595" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="bold">核心数据文件</text>
  <text x="60" y="615" font-size="10" fill="#7ee787">• novel_texts.json (346KB) — 小说正文</text>
  <text x="60" y="632" font-size="10" fill="#7ee787">• chapters.json — 章节元数据</text>
  <text x="200" y="615" font-size="10" fill="#7ee787">• audio.json — TTS 音频信息</text>
  <text x="200" y="632" font-size="10" fill="#7ee787">• logs.json — 监督日志</text>
  <text x="60" y="649" font-size="10" fill="#f0883e">• tasks.json — 任务状态</text>
  <text x="200" y="649" font-size="10" fill="#f0883e">• supervision.json — 监督配置</text>
  
</svg>